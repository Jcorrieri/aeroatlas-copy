[project]
name = "aeroatlas-backend"
version = "0.1.0"
description = "AeroAtlas FastAPI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi[standard]>=0.115,<0.116",
    "httpx>=0.27,<0.28",
    "pwdlib[argon2]>=0.2,<1",
    "python-dotenv>=1,<2",
    "sqlalchemy>=2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
