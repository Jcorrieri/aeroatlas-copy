[project]
name = "aeroatlas-backend"
version = "0.1.0"
description = "AeroAtlas FastAPI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "diskcache>=5.6,<6",
    "fastapi[standard]>=0.115,<0.116",
    "httpx>=0.27,<0.28",
    "python-dotenv>=1,<2",
    "wikipedia-api>=0.7,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
